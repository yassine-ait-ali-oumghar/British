services:

  web:
    build: .
    container_name: british_style_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: british_style_db
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-british_style}
      POSTGRES_USER: ${POSTGRES_USER:-british_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-british_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: